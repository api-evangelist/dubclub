aid: dubclub
name: DubClub
description: DubClub is an all-in-one platform to create and join sports betting communities.
  It is a marketplace connecting sports betting content creators known as cappers or handicappers
  with subscribers who want timely, reliable betting picks and analysis. Creators monetize their
  expertise by selling picks and predictions through paid subscriptions, while subscribers receive
  content directly via notifications and messaging rather than scattered across social media and
  Discord. DubClub has facilitated tens of millions in payments for creators and delivered hundreds
  of millions of messages containing informational sports betting content. This profile was surfaced
  as a portfolio company of Uncork Capital; DubClub publishes a consumer web product and does not
  expose a public developer API program at this time.
